<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Necati Cepte — Sıfırlama</title>
<body style="font-family:system-ui;background:#150b2d;color:white;display:grid;place-items:center;min-height:100vh;text-align:center">
<div>
<h1>♻️ Necati Cepte sıfırlanıyor</h1>
<p id="s">Eski önbellek temizleniyor…</p>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(async r=>{
        const url=String(r.active?.scriptURL||r.waiting?.scriptURL||r.installing?.scriptURL||'');
        if(url.includes('OneSignalSDK')) return false;
        return r.unregister();
      }));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>{
        // OneSignal önbelleklerine dokunma; sadece Necati Cepte cache'lerini temizle.
        if(/onesignal/i.test(k)) return Promise.resolve(false);
        if(/^necati-cepte-/i.test(k)) return caches.delete(k);
        return Promise.resolve(false);
      }));
    }
    document.getElementById('s').textContent='Tamam ✅ Yeni sürüm açılıyor…';
  }catch(e){
    document.getElementById('s').textContent='Temizleme tamamlanamadı ama devam ediliyor…';
  }
  setTimeout(()=>location.replace('./?fresh=1083&ts='+Date.now()),900);
})();
</script>
</body>
</html>
